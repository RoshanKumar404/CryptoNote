services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptonote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryptonote
      POSTGRES_PASSWORD: cryptonotesecret
      POSTGRES_DB: cryptonote_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptonote -d cryptonote_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
