# fly.toml app configuration file generated for cryptonote-backend on 2026-11-23T22:57:44+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'cryptonote-backend'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  HOST = '0.0.0.0'
  JWT_ACCESS_EXPIRATION = '15m'
  JWT_REFRESH_EXPIRATION = '7d'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
