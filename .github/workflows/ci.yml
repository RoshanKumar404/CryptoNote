name: CI (Frontend & Backend Upgrade Compatibility)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Tests & Envelope Integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cryptnote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Prisma Migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/cryptnote_test?schema=public"
          JWT_SECRET: "test-jwt-secret-min-32-chars-long!!"
        run: npx prisma migrate deploy

      - name: Run Backend Test Suite (NV-BE-1, NV-BE-2, NV-BE-3, NV-BE-4)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/cryptnote_test?schema=public"
          JWT_SECRET: "test-jwt-secret-min-32-chars-long!!"
          NODE_ENV: "test"
        run: npm test

  frontend-tests:
    name: Android Unit Tests & Golden Fixtures (NV-FE-1, NV-FE-8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests (Loads Golden Fixtures & Room Migration)
        working-directory: CryptNote
        run: ./gradlew testDebugUnitTest --no-daemon
